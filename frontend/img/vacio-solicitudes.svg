<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true"><style>.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.flota{animation:flota 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.marcha{animation:marcha 2.4s linear infinite}.brillo{animation:brillo 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.brillo.b{animation-duration:3.4s;animation-delay:-1.2s}.onda{animation:onda 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{to{transform:translateY(-8px)}}@keyframes flota{to{transform:translate(6px,8px) rotate(5deg)}}@keyframes marcha{to{stroke-dashoffset:-16}}@keyframes brillo{from{transform:scale(.5) rotate(0);opacity:.6}to{transform:scale(1.1) rotate(30deg);opacity:1}}@keyframes onda{from{transform:scale(.3);opacity:.6}to{transform:scale(1.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.sobre{animation:sobre 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes sobre{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-8px)}}.latido{animation:latido 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes latido{50%{transform:scale(1.18)}}</style><path class="flota" d="M28 80C34 38 90 12 150 20C208 28 232 78 210 124C188 168 100 174 56 144C34 128 26 104 28 80Z" fill="#FFD66B" opacity=".6"/><circle class="flota" cx="36" cy="40" r="12" fill="#E4D7FA"/><circle class="flota" cx="206" cy="148" r="9" fill="#BFE3FF"/><ellipse cx="120" cy="158" rx="60" ry="9" fill="#2A1E3F" opacity=".08"/><g class="sobre"><rect x="60" y="62" width="120" height="78" rx="12" fill="#FFF4E6" stroke="#2A1E3F" stroke-width="3"/><path d="M64 70l56 42 56-42" fill="none" stroke="#2A1E3F" stroke-width="3" stroke-linejoin="round"/><g class="latido"><circle cx="174" cy="66" r="17" fill="#FF5A36" stroke="#2A1E3F" stroke-width="3"/><path d="M166 66l6 6 11-11" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/></g></g><circle class="onda" cx="174" cy="66" r="17" fill="none" stroke="#FF5A36" stroke-width="2.500"/><g transform="translate(52 48)"><path class="brillo" d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" fill="#FF5A36"/></g><g transform="translate(196 112)"><path class="brillo b" d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" fill="#2A1E3F"/></g></svg>
