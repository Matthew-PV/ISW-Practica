<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<style>
  .flota { animation: flota 13s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .flota.b { animation-duration: 17s; animation-delay: -5s; }
  .flota.c { animation-duration: 15s; animation-delay: -9s; animation-direction: alternate-reverse; }
  .bob { animation: bob 3.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
  .bob.b { animation-duration: 4.2s; animation-delay: -1.5s; }
  .bob.c { animation-duration: 3s; animation-delay: -2.2s; }
  .onda { animation: onda 3.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .onda.b { animation-delay: -1.1s; }
  .onda.c { animation-delay: -2.2s; }
  .brillo { animation: brillo 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .brillo.b { animation-duration: 3.6s; animation-delay: -1s; }
  .brillo.c { animation-duration: 2.2s; animation-delay: -1.7s; }
  .marcha { animation: marcha 2.4s linear infinite; }
  .tarjeta { animation: tarjeta 8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .tarjeta.b { animation-duration: 10s; animation-delay: -4s; }
  .sol { animation: giro 40s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes flota { to { transform: translate(14px, 22px) rotate(7deg); } }
  @keyframes bob { to { transform: translateY(-9px); } }
  @keyframes onda { from { transform: scale(.3); opacity: .55; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes brillo { from { transform: scale(.55) rotate(0deg); opacity: .6; } to { transform: scale(1.1) rotate(35deg); opacity: 1; } }
  @keyframes marcha { to { stroke-dashoffset: -28; } }
  @keyframes tarjeta { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(3deg) translateY(-10px); } }
  @keyframes giro { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect width="800" height="1000" fill="#FFF4E6"/>

<!-- Manchas de color -->
<path class="flota" d="M520 -40C700 -60 860 60 840 220C820 360 640 380 560 300C480 220 400 -10 520 -40Z" fill="#E4D7FA"/>
<path class="flota b" d="M-60 700C40 620 200 650 250 760C300 880 200 1060 40 1040C-100 1020 -140 780 -60 700Z" fill="#C6EBD6"/>
<path class="flota c" d="M560 760C660 700 820 740 840 860C860 980 720 1060 620 1010C520 960 470 820 560 760Z" fill="#FFC7B3"/>
<circle class="flota b" cx="40" cy="470" r="70" fill="#BFE3FF"/>
<circle class="flota" cx="720" cy="520" r="34" fill="#FFD66B"/>

<!-- Sol con rayos -->
<g transform="translate(100 120)">
  <g class="sol">
    <circle r="40" fill="#FFD66B"/>
    <g stroke="#FFD66B" stroke-width="7" stroke-linecap="round">
      <path d="M0 -62v-18M0 62v18M-62 0h-18M62 0h18M44 -44l12 -12M-44 44l-12 12M44 44l12 12M-44 -44l-12 -12"/>
    </g>
  </g>
</g>

<!-- Ruta de puntos que avanza -->
<path class="marcha" d="M60 940C200 860 120 760 260 700C420 630 300 520 460 470C620 420 560 300 700 230" fill="none" stroke="#FF5A36" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 14" opacity=".75"/>

<!-- Paradas: onda y pin -->
<g transform="translate(260 700)">
  <circle class="onda" r="34" fill="none" stroke="#FF5A36" stroke-width="3"/>
  <circle class="onda b" r="34" fill="none" stroke="#FF5A36" stroke-width="3"/>
  <g transform="translate(-24 -62) scale(1.5)"><g class="bob"><path d="M16 2C9.9 2 5 6.7 5 12.6c0 7.6 9.2 16.1 10.2 17a1.2 1.2 0 0 0 1.6 0c1-.9 10.2-9.4 10.2-17C27 6.7 22.1 2 16 2Z" fill="#FF5A36"/><circle cx="16" cy="12.5" r="5" fill="#2A1E3F"/><circle cx="17.600" cy="10.900" r="1.400" fill="#FFF4E6"/></g></g>
</g>
<g transform="translate(460 470)">
  <circle class="onda b" r="34" fill="none" stroke="#2A1E3F" stroke-width="3"/>
  <circle class="onda c" r="34" fill="none" stroke="#2A1E3F" stroke-width="3"/>
  <g transform="translate(-24 -62) scale(1.5)"><g class="bob b"><path d="M16 2C9.9 2 5 6.7 5 12.6c0 7.6 9.2 16.1 10.2 17a1.2 1.2 0 0 0 1.6 0c1-.9 10.2-9.4 10.2-17C27 6.7 22.1 2 16 2Z" fill="#2A1E3F"/><circle cx="16" cy="12.5" r="5" fill="#FFC7B3"/><circle cx="17.600" cy="10.900" r="1.400" fill="#FFF4E6"/></g></g>
</g>
<g transform="translate(700 230)">
  <circle class="onda" r="34" fill="none" stroke="#FF5A36" stroke-width="3"/>
  <circle class="onda c" r="34" fill="none" stroke="#FF5A36" stroke-width="3"/>
  <g transform="translate(-24 -62) scale(1.5)"><g class="bob c"><path d="M16 2C9.9 2 5 6.7 5 12.6c0 7.6 9.2 16.1 10.2 17a1.2 1.2 0 0 0 1.6 0c1-.9 10.2-9.4 10.2-17C27 6.7 22.1 2 16 2Z" fill="#FF5A36"/><circle cx="16" cy="12.5" r="5" fill="#2A1E3F"/><circle cx="17.600" cy="10.900" r="1.400" fill="#FFF4E6"/></g></g>
</g>

<!-- Tarjeta de plan (arriba a la derecha) -->
<g transform="translate(560 110)">
  <g class="tarjeta">
    <rect width="190" height="132" rx="16" fill="#FFFFFF"/>
    <rect x="10" y="10" width="170" height="68" rx="10" fill="#FFC7B3"/>
    <circle cx="146" cy="32" r="12" fill="#FFD66B"/>
    <path d="M10 78L52 40l30 26 26-18 72 30z" fill="#FF5A36" opacity=".85"/>
    <rect x="10" y="90" width="110" height="9" rx="4.500" fill="#2A1E3F"/>
    <rect x="10" y="108" width="70" height="8" rx="4" fill="#E4D7FA"/>
    <rect x="132" y="104" width="48" height="16" rx="8" fill="#C6EBD6"/>
  </g>
</g>

<!-- Tarjeta de amigos (abajo a la izquierda) -->
<g transform="translate(70 800)">
  <g class="tarjeta b">
    <rect width="210" height="112" rx="16" fill="#FFFFFF"/>
    <circle cx="36" cy="38" r="20" fill="#BFE3FF"/>
    <circle cx="36" cy="33" r="7" fill="#2A1E3F"/>
    <path d="M23 52c3-9 21-9 26 0" fill="#2A1E3F"/>
    <rect x="66" y="26" width="110" height="9" rx="4.500" fill="#2A1E3F"/>
    <rect x="66" y="44" width="76" height="8" rx="4" fill="#E4D7FA"/>
    <g fill="#FFD66B" transform="translate(22 88)">
      <path id="e" d="M0-10L2.900-3.100 10-2.500 4.600 2 6.200 9 0 5.300-6.200 9-4.600 2-10-2.500-2.900-3.100Z"/>
      <use href="#e" x="26"/><use href="#e" x="52"/><use href="#e" x="78"/>
      <use href="#e" x="104" fill="#F0E8D8"/>
    </g>
  </g>
</g>

<!-- Pegatinas: brillos y garabatos -->
<path class="brillo" transform="translate(330 110)" d="M0 -18Q3 -3 18 0Q3 3 0 18Q-3 3 -18 0Q-3 -3 0 -18Z" fill="#FF5A36"/>
<path class="brillo b" transform="translate(690 640)" d="M0 -14Q2 -2 14 0Q2 2 0 14Q-2 2 -14 0Q-2 -2 0 -14Z" fill="#2A1E3F"/>
<path class="brillo c" transform="translate(150 610)" d="M0 -12Q2 -2 12 0Q2 2 0 12Q-2 2 -12 0Q-2 -2 0 -12Z" fill="#FF5A36"/>
<path class="brillo" transform="translate(560 930)" d="M0 -16Q3 -3 16 0Q3 3 0 16Q-3 3 -16 0Q-3 -3 0 -16Z" fill="#FFD66B"/>
<path class="flota" d="M250 40q10-14 20 0t20 0t20 0t20 0" fill="none" stroke="#FF5A36" stroke-width="5" stroke-linecap="round"/>
<path class="flota b" d="M620 560q10-14 20 0t20 0t20 0" fill="none" stroke="#2A1E3F" stroke-width="5" stroke-linecap="round" opacity=".7"/>
<circle cx="360" cy="960" r="9" fill="none" stroke="#2A1E3F" stroke-width="3"/>
<circle cx="30" cy="300" r="7" fill="#FF5A36"/>
</svg>
