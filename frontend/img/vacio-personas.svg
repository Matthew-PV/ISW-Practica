<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true"><style>.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.flota{animation:flota 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.marcha{animation:marcha 2.4s linear infinite}.brillo{animation:brillo 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.brillo.b{animation-duration:3.4s;animation-delay:-1.2s}.onda{animation:onda 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{to{transform:translateY(-8px)}}@keyframes flota{to{transform:translate(6px,8px) rotate(5deg)}}@keyframes marcha{to{stroke-dashoffset:-16}}@keyframes brillo{from{transform:scale(.5) rotate(0);opacity:.6}to{transform:scale(1.1) rotate(30deg);opacity:1}}@keyframes onda{from{transform:scale(.3);opacity:.6}to{transform:scale(1.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.lupa{animation:lupa 6s ease-in-out infinite alternate}@keyframes lupa{0%{transform:translate(-26px,6px)}50%{transform:translate(10px,-8px)}100%{transform:translate(30px,10px)}}</style><path class="flota" d="M30 90C30 44 80 14 132 22C190 30 226 70 208 118C190 164 110 176 64 150C40 136 30 114 30 90Z" fill="#C6EBD6"/><circle class="flota" cx="208" cy="36" r="13" fill="#FFD66B"/><circle class="flota" cx="30" cy="40" r="8" fill="#FFC7B3"/><ellipse cx="120" cy="158" rx="62" ry="9" fill="#2A1E3F" opacity=".08"/><g stroke="#2A1E3F" stroke-width="3"><circle cx="82" cy="92" r="16" fill="#BFE3FF"/><path d="M58 142c2-24 14-34 24-34s22 10 24 34z" fill="#BFE3FF"/><circle cx="158" cy="92" r="16" fill="#FFC7B3"/><path d="M134 142c2-24 14-34 24-34s22 10 24 34z" fill="#FFC7B3"/></g><g class="lupa"><circle cx="120" cy="76" r="28" fill="#FFF4E6" fill-opacity=".85" stroke="#2A1E3F" stroke-width="4"/><path d="M142 98l26 26" stroke="#2A1E3F" stroke-width="9" stroke-linecap="round"/><path d="M142 98l26 26" stroke="#FF5A36" stroke-width="3" stroke-linecap="round"/><path d="M104 66a20 20 0 0 1 16-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(44 134)"><path class="brillo" d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" fill="#FF5A36"/></g><g transform="translate(204 76)"><path class="brillo b" d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" fill="#2A1E3F"/></g></svg>
