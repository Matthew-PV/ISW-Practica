<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true"><style>.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.flota{animation:flota 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.marcha{animation:marcha 2.4s linear infinite}.brillo{animation:brillo 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.brillo.b{animation-duration:3.4s;animation-delay:-1.2s}.onda{animation:onda 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{to{transform:translateY(-8px)}}@keyframes flota{to{transform:translate(6px,8px) rotate(5deg)}}@keyframes marcha{to{stroke-dashoffset:-16}}@keyframes brillo{from{transform:scale(.5) rotate(0);opacity:.6}to{transform:scale(1.1) rotate(30deg);opacity:1}}@keyframes onda{from{transform:scale(.3);opacity:.6}to{transform:scale(1.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.nube{animation:nube 12s ease-in-out infinite alternate}@keyframes nube{to{transform:translateX(26px)}}.tiembla{animation:tiembla 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes tiembla{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}</style><path class="flota" d="M34 84C36 40 92 14 148 22C206 30 230 80 208 124C186 166 100 172 58 142C36 126 32 106 34 84Z" fill="#FFC7B3" opacity=".7"/><circle class="flota" cx="206" cy="40" r="11" fill="#FFD66B"/><g class="nube"><path d="M40 52a12 12 0 0 1 22-5 14 14 0 0 1 26 6 10 10 0 0 1-2 20H46a11 11 0 0 1-6-21Z" fill="#fff" stroke="#2A1E3F" stroke-width="3"/></g><ellipse cx="120" cy="158" rx="62" ry="9" fill="#2A1E3F" opacity=".08"/><path class="marcha" d="M40 140c18-26 38-26 52-8 14 18 32 16 44-6 12-20 30-18 48 8" fill="none" stroke="#FF5A36" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12"/><g class="tiembla"><path d="M120 34c-20 0-36 14-36 33 0 26 34 56 35 57a2 2 0 0 0 2 0c1-1 35-31 35-57 0-19-16-33-36-33Z" fill="#FFF4E6" stroke="#2A1E3F" stroke-width="3"/><path d="M120 54v22" stroke="#2A1E3F" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="92" r="4.500" fill="#FF5A36" stroke="#2A1E3F" stroke-width="2"/></g><g transform="translate(196 100)"><path class="brillo" d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" fill="#FF5A36"/></g><g transform="translate(44 112)"><path class="brillo b" d="M0-12Q2-2 12 0Q2 2 0 12Q-2 2-12 0Q-2-2 0-12Z" fill="#2A1E3F"/></g></svg>
