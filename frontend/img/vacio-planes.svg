<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" aria-hidden="true"><style>.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}.flota{animation:flota 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.marcha{animation:marcha 2.4s linear infinite}.brillo{animation:brillo 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.brillo.b{animation-duration:3.4s;animation-delay:-1.2s}.onda{animation:onda 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{to{transform:translateY(-8px)}}@keyframes flota{to{transform:translate(6px,8px) rotate(5deg)}}@keyframes marcha{to{stroke-dashoffset:-16}}@keyframes brillo{from{transform:scale(.5) rotate(0);opacity:.6}to{transform:scale(1.1) rotate(30deg);opacity:1}}@keyframes onda{from{transform:scale(.3);opacity:.6}to{transform:scale(1.6);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.cal{animation:cal 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}@keyframes cal{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}</style><path class="flota" d="M40 70C46 30 100 10 160 22C214 34 232 86 206 126C180 166 96 172 54 140C32 124 36 96 40 70Z" fill="#E4D7FA"/><circle class="flota" cx="204" cy="40" r="14" fill="#FFD66B"/><circle class="flota" cx="34" cy="136" r="9" fill="#C6EBD6"/><ellipse cx="120" cy="158" rx="62" ry="9" fill="#2A1E3F" opacity=".08"/><g class="cal"><rect x="64" y="46" width="112" height="96" rx="12" fill="#FFF4E6" stroke="#2A1E3F" stroke-width="3"/><path d="M64 70h112" stroke="#2A1E3F" stroke-width="3"/><path d="M92 46V34M148 46V34" stroke="#2A1E3F" stroke-width="3" stroke-linecap="round"/><g fill="#C9C0D6"><rect x="78" y="106" width="16" height="10" rx="3"/><rect x="100" y="106" width="16" height="10" rx="3"/><rect x="146" y="106" width="16" height="10" rx="3"/><rect x="78" y="122" widt