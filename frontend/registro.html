<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Crear cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PlanB</a>
    </div>
  </nav>

  <main class="container contenedor-formulario py-5">
    <h1 class="h3 mb-4">Crear cuenta</h1>

    <form id="form-registro">
      <div class="mb-3">
        <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="nombreUsuario" required minlength="3" maxlength="30">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required minlength="8" maxlength="72" aria-describedby="requisitos-password">
        <!-- CS-64: requisitos de la contraseña, marcados mientras se escribe (js/shared/password.js) -->
        <ul id="requisitos-password" class="list-unstyled small mt-2 mb-0"></ul>
      </div>
      <!-- CAPTCHA de Cloudflare Turnstile, lo muestra iniciarCaptcha() de js/registro.js -->
      <div id="captcha" class="mb-3"></div>
      <div id="error-registro" class="alert alert-danger d-none"></div>
      <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
    </form>

    <p class="mt-3 text-center">
      ¿Ya tienes cuenta? <a href="/">Inicia sesión</a>
    </p>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/password.js"></script>
  <script src="js/registro.js"></script>
  <!-- Va después de registro.js, que define iniciarCaptcha() -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=iniciarCaptcha" async defer></script>
</body>
</html>
