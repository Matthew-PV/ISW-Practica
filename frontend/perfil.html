<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Mi perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PlanB</a>
      <a class="nav-link text-light" href="bienvenida.html">Volver</a>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 500px;">
    <h1 class="h3 mb-4">Mi perfil</h1>

    <div class="text-center mb-4">
      <img id="foto-perfil" src="" alt="Foto de perfil" class="rounded-circle d-none" width="120" height="120">
    </div>

    <form id="form-perfil">
      <div class="mb-3">
        <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="nombreUsuario" required minlength="3">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" disabled>
      </div>
      <div class="mb-3">
        <label for="ciudad" class="form-label">Ciudad</label>
        <input type="text" class="form-control" id="ciudad">
      </div>
      <div id="error-perfil" class="alert alert-danger d-none"></div>
      <div id="exito-perfil" class="alert alert-success d-none"></div>
      <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
    </form>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
