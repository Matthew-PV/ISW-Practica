<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Buscar personas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="bienvenida.html">PlanB</a>
      <div class="d-flex gap-3">
        <a class="nav-link text-light" href="bienvenida.html">Inicio</a>
        <a class="nav-link text-light" href="personas.html">Buscar personas</a>
        <a class="nav-link text-light" href="perfil.html">Mi perfil</a>
      </div>
    </div>
  </nav>

  <main class="container contenedor-formulario py-5">
    <h1 class="h3 mb-4">Buscar personas</h1>

    <form id="form-busqueda" class="mb-4">
      <label for="texto-busqueda" class="form-label">Nombre de usuario</label>
      <div class="input-group">
        <input id="texto-busqueda" type="search" class="form-control" required>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </div>
    </form>

    <div id="error-busqueda" class="alert alert-danger d-none" role="alert"></div>
    <p id="sin-resultados" class="text-secondary d-none">No se han encontrado personas.</p>
    <div id="resultados" class="list-group" aria-live="polite"></div>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/pantalla.js"></script>
  <script src="js/personas.js"></script>
</body>
</html>
