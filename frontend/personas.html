<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Buscar personas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-sesion">
  <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>
  <nav class="barra-sesion" aria-label="Navegación principal">
    <div class="container">
      <a class="marca-planb" href="bienvenida.html">PlanB</a>
      <div class="navegacion-sesion">
        <a href="bienvenida.html">Inicio</a>
        <a href="personas.html" aria-current="page">Buscar personas</a>
        <a href="perfil.html">Mi perfil</a>
      </div>
    </div>
  </nav>

  <main id="contenido-principal" class="container pagina-personas" tabindex="-1">
    <section class="buscador-personas" aria-labelledby="titulo-busqueda">
      <h1 id="titulo-busqueda">Buscar personas</h1>

      <form id="form-busqueda">
        <label for="texto-busqueda" class="form-label">Nombre de usuario</label>
        <input id="texto-busqueda" type="search" class="form-control" required>
        <button type="submit" class="btn boton-principal">Buscar</button>
      </form>

      <!-- Antes de buscar se explica qué escribir; mientras se busca, «Cargando…» (js/personas.js) -->
      <p id="ayuda-busqueda" class="texto-suave">Escribe parte de un nombre.</p>
      <p id="cargando" class="texto-suave d-none" role="status">Cargando…</p>
      <div id="error-busqueda" class="alert alert-danger d-none" role="alert"></div>
      <p id="sin-resultados" class="texto-suave d-none">No se han encontrado personas.</p>
      <div id="resultados" class="lista-resultados-personas" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/pantalla.js"></script>
  <script src="js/personas.js"></script>
</body>
</html>
