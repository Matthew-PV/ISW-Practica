<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Buscar personas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-buscar">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="bienvenida.html">PlanB</a>
        <a class="cabecera-enlace" href="bienvenida.html">Inicio</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar personas" placeholder="Buscar personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-cuenta">
        <summary><span class="menu-avatar" aria-hidden="true"></span>Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="perfil.html">Mi perfil</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container contenedor-formulario py-5">
    <h1 class="h3 mb-4">Buscar personas</h1>

    <form id="form-busqueda" class="mb-4">
      <label for="texto-busqueda" class="form-label">Nombre de usuario</label>
      <div class="input-group">
        <input id="texto-busqueda" type="search" class="form-control" required>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </div>
    </form>

    <!-- Antes de buscar se explica qué escribir; mientras se busca, «Cargando…» (js/personas.js) -->
    <p id="ayuda-busqueda" class="text-secondary">Escribe parte de un nombre.</p>
    <p id="cargando" class="text-secondary d-none" role="status">Cargando…</p>
    <div id="error-busqueda" class="alert alert-danger d-none" role="alert"></div>
    <p id="sin-resultados" class="text-secondary d-none">No se han encontrado personas.</p>
    <div id="resultados" class="list-group" aria-live="polite"></div>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/pantalla.js"></script>
  <script src="js/shared/cabecera.js"></script>
  <script src="js/personas.js"></script>
</body>
</html>
