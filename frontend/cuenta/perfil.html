<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Mi perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/perfil.css" rel="stylesheet">
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/cuenta/bienvenida.html">PlanB</a>
        <a class="cabecera-enlace" href="/cuenta/bienvenida.html">Inicio</a>
        <a class="cabecera-enlace" href="/social/solicitudes.html">Solicitudes</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar personas" placeholder="Buscar personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-cuenta">
        <summary><span class="menu-avatar" aria-hidden="true"></span>Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/cuenta/perfil.html" aria-current="page">Mi perfil</a>
          <a href="/cuenta/ajustes.html">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <p id="cargando" class="text-secondary" role="status">Cargando…</p>

    <!-- Cabecera: foto, nombre y contadores en texto (no son enlaces). js/perfil.js los rellena. -->
    <section class="cabecera-perfil mb-4" aria-label="Resumen del perfil">
      <img id="foto-perfil" src="/img/foto-por-defecto.svg" alt="Foto de perfil" width="120" height="120">
      <div>
        <h1 id="nombre-perfil" class="mb-3"></h1>
        <ul class="cabecera-perfil-contadores">
          <li><span id="total-experiencias" class="contador-numero">0</span> <span class="contador-rotulo">experiencias</span></li>
          <li><span id="total-amigos" class="contador-numero">0</span> <span class="contador-rotulo">amigos</span></li>
          <li><span id="total-seguidores" class="contador-numero">0</span> <span class="contador-rotulo">seguidores</span></li>
        </ul>
      </div>
    </section>

    <div role="tablist" aria-label="Contenido del perfil" id="pestanas-perfil">
      <button type="button" role="tab" id="pestana-experiencias" aria-controls="panel-experiencias" aria-selected="true">Experiencias</button>
      <button type="button" role="tab" id="pestana-amigos" aria-controls="panel-amigos" aria-selected="false" tabindex="-1">Amigos</button>
      <button type="button" role="tab" id="pestana-seguidores" aria-controls="panel-seguidores" aria-selected="false" tabindex="-1">Seguidores</button>
    </div>

    <div id="error-relaciones" class="alert alert-danger d-none mt-3" role="alert"></div>

    <!-- CS-44: mis experiencias, también las privadas; las pinta js/shared/experiencias.js -->
    <div role="tabpanel" id="panel-experiencias" aria-labelledby="pestana-experiencias" class="pt-4">
      <div id="error-experiencias" class="alert alert-danger d-none" role="alert"></div>
      <p id="sin-experiencias" class="text-secondary d-none">Todavía no has publicado experiencias.</p>
      <div id="lista-experiencias" class="rejilla-experiencias"></div>
      <div class="text-center mt-3">
        <button type="button" id="mas-experiencias" class="btn btn-outline-primary d-none">Cargar más experiencias</button>
      </div>
    </div>

    <!-- Amigos y seguidores (CS-45). js/perfil.js los obtiene desde /api/perfil/resumen,
         /api/perfil/amigos y /api/perfil/seguidores. -->
    <div role="tabpanel" id="panel-amigos" aria-labelledby="pestana-amigos" class="pt-4" hidden>
      <p id="sin-amigos" class="text-secondary d-none">Todavía no tienes amigos.</p>
      <div id="lista-amigos" class="list-group"></div>
      <button type="button" id="mas-amigos" class="btn btn-outline-primary mt-2 d-none">Cargar más amigos</button>
    </div>

    <div role="tabpanel" id="panel-seguidores" aria-labelledby="pestana-seguidores" class="pt-4" hidden>
      <p id="sin-seguidores" class="text-secondary d-none">Todavía no tienes seguidores.</p>
      <div id="lista-seguidores" class="list-group"></div>
      <button type="button" id="mas-seguidores" class="btn btn-outline-primary mt-2 d-none">Cargar más seguidores</button>
    </div>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/shared/pestanas.js"></script>
  <script src="/js/shared/experiencias.js"></script>
  <script src="/js/perfil.js"></script>
</body>
</html>
