<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Bienvenida</title>
  <link rel="icon" href="/img/logo-pin.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/cuenta/bienvenida.html"><img src="/img/logo.svg" alt="PlanB" width="112" height="32"></a>
        <a class="cabecera-enlace" href="/cuenta/bienvenida.html" aria-current="page">Inicio</a>
        <a class="cabecera-enlace" href="/social/solicitudes.html">Solicitudes</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar personas" placeholder="Buscar personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-cuenta">
        <summary><img class="menu-avatar" src="/img/foto-por-defecto.svg" alt="" width="32" height="32">Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/cuenta/perfil.html">Mi perfil</a>
          <a href="/cuenta/ajustes.html">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <h1 class="mb-1">Tus experiencias</h1>
    <p class="text-secondary mb-4">¡Bienvenido, <span id="nombre-usuario"></span>!</p>
    <p id="cargando" class="text-secondary" role="status">Cargando…</p>
    <div id="error-lista" role="alert" class="alert alert-danger d-none"></div>

    <div id="rejilla" class="rejilla-experiencias">
      <div class="col" id="columna-nueva">
        <button
          type="button"
          id="boton-nueva"
          class="tarjeta-nueva"
        >
          <span class="tarjeta-nueva-signo" aria-hidden="true">+</span>
          Nueva experiencia
        </button>
      </div>
    </div>
    <div id="sin-experiencias" class="estado-vacio d-none"><img src="/img/vacio-planes.svg" alt="" width="240" height="180"><p>Todavía no has publicado experiencias.</p></div>
    <!-- CS-44: las siguientes páginas de mis experiencias -->
    <div class="text-center mt-3">
      <button type="button" id="mas-experiencias" class="btn btn-outline-primary d-none">Cargar más</button>
    </div>
  </main>

  <!-- Formulario para crear o editar una experiencia -->
  <dialog
    id="dialogo-experiencia"
    class="dialogo-experiencia"
    aria-labelledby="titulo-dialogo"
  >
    <form id="form-experiencia" class="p-4">
      <h2 id="titulo-dialogo" class="h5 mb-3">Nueva experiencia</h2>

      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input
          type="text"
          class="form-control"
          id="titulo"
          maxlength="191"
          required
        >
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea
          class="form-control"
          id="descripcion"
          rows="4"
          required
        ></textarea>
      </div>

      <div class="mb-3">
        <label for="ciudadId" class="form-label">Ciudad</label>
        <select class="form-select" id="ciudadId" required>
          <option value="">Elige una ciudad</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="visibilidad" class="form-label">Visibilidad</label>
        <select class="form-select" id="visibilidad">
          <option value="PRIVADA">Privada</option>
          <option value="AMIGOS">Amigos</option>
          <option value="PUBLICA" selected>Pública</option>
        </select>
        <div id="descripcion-visibilidad" class="form-text"></div>
      </div>

      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo (opcional)</label>
        <input
          type="text"
          class="form-control"
          id="tipo"
          maxlength="191"
          placeholder="Cultural, gastronómica..."
        >
      </div>

      <div class="mb-3">
        <label for="momentoAdecuado" class="form-label">
          Momento adecuado (opcional)
        </label>
        <input
          type="text"
          class="form-control"
          id="momentoAdecuado"
          maxlength="191"
          placeholder="Por la tarde, en primavera..."
        >
      </div>

      <div
        id="error-experiencia" role="alert"
        class="alert alert-danger d-none"
      ></div>

      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          id="boton-cancelar"
          class="btn btn-outline-primary"
        >
          Cancelar
        </button>

        <button type="submit" class="btn btn-primary">
          Guardar
        </button>
      </div>
    </form>
  </dialog>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/bienvenida.js"></script>
</body>
</html>
