<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Ajustes</title>
  <link rel="icon" href="/img/logo-pin.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  </head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/cuenta/bienvenida.html"><img src="/img/logo.svg" alt="PlanB" width="112" height="32"></a>
        <a class="cabecera-enlace" href="/cuenta/bienvenida.html">Inicio</a>
        <a class="cabecera-enlace" href="/experiencias/explorar.html">Explorar</a>
        <a class="cabecera-enlace" href="/cuenta/mis-planes.html">Mis planes</a>
        <a class="cabecera-enlace" href="/social/amigos.html">Amigos</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar personas" placeholder="Buscar personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-notificaciones">
        <summary aria-label="Notificaciones">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span id="contador-notificaciones" class="contador-notificaciones d-none" aria-live="polite"></span>
        </summary>
        <div class="menu-notificaciones-lista">
          <p class="menu-notificaciones-titulo">Notificaciones</p>
          <div id="lista-notificaciones"></div>
          <p id="sin-notificaciones" class="menu-notificaciones-vacio">No tienes notificaciones nuevas.</p>
          <a class="menu-notificaciones-pie" href="/social/amigos.html">Ver amigos y solicitudes</a>
        </div>
      </details>
      <details class="menu-cuenta">
        <summary><img class="menu-avatar" src="/img/foto-por-defecto.svg" alt="" width="32" height="32">Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/cuenta/perfil.html">Mi perfil</a>
          <a href="/cuenta/ajustes.html" aria-current="page">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <p id="cargando" class="text-secondary" role="status">Cargando…</p>
    <h1 class="mb-4">Ajustes</h1>

    <div role="tablist" aria-label="Ajustes" id="pestanas-ajustes">
      <button type="button" role="tab" id="pestana-datos" aria-controls="panel-datos" aria-selected="true">Perfil</button>
      <button type="button" role="tab" id="pestana-password" aria-controls="panel-password" aria-selected="false" tabindex="-1">Contraseña</button>
    </div>

    <div class="contenedor-formulario ajustes-panel tarjeta-panel mt-3">
      <div role="tabpanel" id="panel-datos" aria-labelledby="pestana-datos">
      <!-- La foto se sube en cuanto se elige (js/ajustes.js): el avatar es la etiqueta del selector de archivo -->
      <div class="ajustes-foto">
        <label for="foto" class="foto-editable">
          <img id="foto-perfil" class="rounded-circle" src="/img/foto-por-defecto.svg" alt="Foto de perfil actual" width="144" height="144">
          <svg class="foto-editable-icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.500-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.500"/></svg>
          <span class="visually-hidden">Cambiar foto de perfil (JPG, PNG o WebP, máximo 5 MB)</span>
        </label>
        <input type="file" class="visually-hidden" id="foto" accept="image/jpeg,image/png,image/webp">
        <div id="ayuda-foto" class="form-text">Se guarda en cuanto la eliges.</div>
        <div id="error-foto" role="alert" class="alert alert-danger d-none mt-2"></div>
        <div id="exito-foto" class="alert alert-success d-none mt-2"></div>
      </div>

      <form id="form-perfil">
        <div class="mb-3">
          <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" id="nombreUsuario" required minlength="3" maxlength="30">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" disabled>
        </div>
        <div class="mb-3">
          <label for="ciudad" class="form-label">Ciudad</label>
          <input type="text" class="form-control" id="ciudad" maxlength="191">
        </div>
        <div id="error-perfil" role="alert" class="alert alert-danger d-none"></div>
        <p id="estado-guardado" class="estado-guardado" role="status"></p>
      </form>
      </div>

      <div role="tabpanel" id="panel-password" aria-labelledby="pestana-password" hidden>
      <!-- CS-64: cambiar la contraseña (js/ajustes.js; los requisitos los marca js/shared/password.js) -->
      <section aria-labelledby="titulo-password">
        <h2 id="titulo-password" class="h4">Cambiar contraseña</h2>
        <form id="form-password">
          <div class="mb-3">
            <label for="password-actual" class="form-label">Contraseña actual</label>
            <input type="password" class="form-control" id="password-actual" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label for="password-nueva" class="form-label">Contraseña nueva</label>
            <input type="password" class="form-control" id="password-nueva" required autocomplete="new-password" aria-describedby="requisitos-password">
            <ul id="requisitos-password" class="list-unstyled small mt-2 mb-0"></ul>
          </div>
          <div class="mb-3">
            <label for="password-repetida" class="form-label">Repite la contraseña nueva</label>
            <input type="password" class="form-control" id="password-repetida" required autocomplete="new-password">
          </div>
          <div id="error-password" class="alert alert-danger d-none" role="alert"></div>
          <div id="exito-password" class="alert alert-success d-none"></div>
          <button type="submit" class="btn btn-outline-primary">Cambiar contraseña</button>
        </form>
      </section>
      </div>
    </div>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/shared/pestanas.js"></script>
  <script src="/js/shared/password.js"></script>
  <script src="/js/ajustes.js"></script>
</body>
</html>
