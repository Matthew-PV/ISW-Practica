<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Bienvenida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PlanB</a>
      <div class="d-flex gap-3">
        <a class="nav-link text-light" href="personas.html">Buscar personas</a>
        <a class="nav-link text-light" href="perfil.html">Mi perfil</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">¡Bienvenido, <span id="nombre-usuario"></span>!</h1>

    <h2 class="h5 mb-3">Mis experiencias</h2>
    <div id="error-lista" class="alert alert-danger d-none"></div>

    <div id="rejilla" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
      <div class="col" id="columna-nueva">
        <button
          type="button"
          id="boton-nueva"
          class="tarjeta-nueva"
          aria-label="Nueva experiencia"
        >
          +
        </button>
      </div>
    </div>
  </main>

  <!-- Formulario para crear o editar una experiencia -->
  <dialog
    id="dialogo-experiencia"
    class="dialogo-experiencia"
    aria-labelledby="titulo-dialogo"
  >
    <form id="form-experiencia" class="p-4">
      <h2 id="titulo-dialogo" class="h5 mb-3">Nueva experiencia</h2>

      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input
          type="text"
          class="form-control"
          id="titulo"
          maxlength="191"
          required
        >
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea
          class="form-control"
          id="descripcion"
          rows="4"
          required
        ></textarea>
      </div>

      <div class="mb-3">
        <label for="ciudadId" class="form-label">Ciudad</label>
        <select class="form-select" id="ciudadId" required>
          <option value="">Elige una ciudad</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="visibilidad" class="form-label">Visibilidad</label>
        <select class="form-select" id="visibilidad">
          <option value="PRIVADA">Privada</option>
          <option value="AMIGOS">Amigos</option>
          <option value="PUBLICA" selected>Pública</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo (opcional)</label>
        <input
          type="text"
          class="form-control"
          id="tipo"
          maxlength="191"
          placeholder="Cultural, gastronómica..."
        >
      </div>

      <div class="mb-3">
        <label for="momentoAdecuado" class="form-label">
          Momento adecuado (opcional)
        </label>
        <input
          type="text"
          class="form-control"
          id="momentoAdecuado"
          maxlength="191"
          placeholder="Por la tarde, en primavera..."
        >
      </div>

      <div
        id="error-experiencia"
        class="alert alert-danger d-none"
      ></div>

      <div class="d-flex justify-content-end gap-2">
        <button
          type="button"
          id="boton-cancelar"
          class="btn btn-outline-secondary"
        >
          Cancelar
        </button>

        <button type="submit" class="btn btn-primary">
          Guardar
        </button>
      </div>
    </form>
  </dialog>

  <script src="js/shared/api.js"></script>
  <script src="js/bienvenida.js"></script>
</body>
</html>
