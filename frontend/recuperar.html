<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Recuperar contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PlanB</a>
    </div>
  </nav>

  <main class="container contenedor-formulario py-5">
    <h1 class="h3 mb-3">Recuperar contraseña</h1>
    <p class="text-secondary">Escribe el email de tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.</p>

    <!-- CS-64: pide el enlace (js/recuperar.js) -->
    <form id="form-recuperar">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required autocomplete="email">
      </div>
      <div id="error-recuperar" class="alert alert-danger d-none" role="alert"></div>
      <div id="exito-recuperar" class="alert alert-success d-none"></div>
      <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
    </form>

    <p class="mt-3 text-center">
      <a href="index.html">Volver a iniciar sesión</a>
    </p>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
