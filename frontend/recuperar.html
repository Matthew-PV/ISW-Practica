<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Recuperar contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-acceso">
  <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>
  <nav class="barra-acceso" aria-label="Acceso">
    <div class="container">
      <a class="marca-planb" href="index.html">PlanB</a>
    </div>
  </nav>

  <main id="contenido-principal" class="container contenedor-formulario pagina-acceso-contenido" tabindex="-1">
    <section class="tarjeta-formulario" aria-labelledby="titulo-recuperar">
    <h1 id="titulo-recuperar">Recuperar contraseña</h1>
    <p class="descripcion-acceso">Escribe el email de tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.</p>

    <!-- CS-64: pide el enlace (js/recuperar.js) -->
    <form id="form-recuperar">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required autocomplete="email">
      </div>
      <div id="error-recuperar" class="alert alert-danger d-none" role="alert"></div>
      <div id="exito-recuperar" class="alert alert-success d-none"></div>
      <button type="submit" class="btn boton-principal w-100">Enviar enlace</button>
    </form>

    <p class="mt-3 text-center">
      <a class="enlace-acceso" href="index.html">Volver a iniciar sesión</a>
    </p>
    </section>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
