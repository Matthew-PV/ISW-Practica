<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Nueva contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-acceso">
  <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>
  <nav class="barra-acceso" aria-label="Acceso">
    <div class="container">
      <a class="marca-planb" href="index.html">PlanB</a>
    </div>
  </nav>

  <main id="contenido-principal" class="container contenedor-formulario pagina-acceso-contenido" tabindex="-1">
    <section class="tarjeta-formulario" aria-labelledby="titulo-restablecer">
    <h1 id="titulo-restablecer">Elige una contraseña nueva</h1>

    <div id="error-restablecer" class="alert alert-danger d-none" role="alert"></div>
    <div id="exito-restablecer" class="alert alert-success d-none"></div>

    <!-- CS-64: se abre desde el enlace del email, restablecer.html?token=... (js/restablecer.js) -->
    <form id="form-restablecer">
      <div class="mb-3">
        <label for="password-nueva" class="form-label">Contraseña nueva</label>
        <input type="password" class="form-control" id="password-nueva" required autocomplete="new-password" aria-describedby="requisitos-password">
        <ul id="requisitos-password" class="list-unstyled small mt-2 mb-0"></ul>
      </div>
      <div class="mb-3">
        <label for="password-repetida" class="form-label">Repite la contraseña nueva</label>
        <input type="password" class="form-control" id="password-repetida" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn boton-principal w-100">Guardar contraseña</button>
    </form>
    </section>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/password.js"></script>
  <script src="js/restablecer.js"></script>
</body>
</html>
