<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Perfil de usuario</title>
  <link rel="icon" href="/img/logo-pin.svg" type="image/svg+xml">
  <link href="/css/tokens.css" rel="stylesheet">
  <link href="/css/base.css" rel="stylesheet">
  <link href="/css/componentes.css" rel="stylesheet">
  <link href="/css/perfil.css" rel="stylesheet">
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/cuenta/bienvenida.html"><img src="/img/logo.svg" alt="PlanB" width="112" height="32"></a>
        <a class="cabecera-enlace" href="/cuenta/bienvenida.html">Inicio</a>
        <a class="cabecera-enlace" href="/experiencias/explorar.html">Explorar</a>
        <a class="cabecera-enlace" href="/cuenta/mis-planes.html">Mis planes</a>
        <a class="cabecera-enlace" href="/social/amigos.html">Amigos</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar planes y personas" placeholder="Planes y personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-notificaciones">
        <summary aria-label="Notificaciones">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span id="contador-notificaciones" class="contador-notificaciones d-none" aria-live="polite"></span>
        </summary>
        <div class="menu-notificaciones-lista">
          <p class="menu-notificaciones-titulo">Notificaciones</p>
          <div id="lista-notificaciones"></div>
          <p id="sin-notificaciones" class="menu-notificaciones-vacio">No tienes notificaciones nuevas.</p>
          <a class="menu-notificaciones-pie" href="/social/amigos.html">Ver amigos y solicitudes</a>
        </div>
      </details>
      <details class="menu-cuenta">
        <summary><img class="menu-avatar" src="/img/foto-por-defecto.svg" alt="" width="32" height="32">Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/cuenta/perfil.html">Mi perfil</a>
          <a href="/cuenta/ajustes.html">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <!-- Se muestra solo si el usuario no existe (js/usuario.js) -->
    <div id="no-encontrado" class="alert alert-warning text-center d-none">Usuario no encontrado</div>

    <p id="cargando" class="text-secondary text-center" role="status">Cargando…</p>

    <!-- Los datos se rellenan desde js/usuario.js con el perfil que devuelve el backend; hasta entonces no se muestra -->
    <div id="perfil-usuario" class="d-none">
      <section class="cabecera-perfil cabecera-perfil-otra mb-4" aria-label="Resumen del perfil">
        <img id="foto-usuario" src="/img/foto-por-defecto.svg" alt="Foto de perfil" width="120" height="120">
        <div>
          <h1 id="nombre-usuario" class="mb-1"></h1>
          <p id="ciudad" class="text-secondary mb-3"></p>
          <ul class="cabecera-perfil-contadores">
            <li><span id="amigos" class="contador-numero">0</span> <span class="contador-rotulo">amigos</span></li>
            <li><span id="seguidores" class="contador-numero">0</span> <span class="contador-rotulo">seguidores</span></li>
          </ul>
        </div>
        <!-- Los botones de amistad los crea js/usuario.js según la relación con este usuario -->
        <!-- El botón de seguir lo crea js/usuario.js; seguir no depende de la amistad -->
        <div class="acciones-perfil d-flex justify-content-center gap-2">
          <div id="botones-amistad" class="d-flex justify-content-center gap-2"></div>
          <div id="boton-seguir" class="d-flex justify-content-center"></div>
        </div>
        <div id="error-usuario" role="alert" class="alert alert-danger d-none"></div>
      </section>

      <!-- CS-44: sus experiencias que puedo ver; las pinta js/shared/experiencias.js -->
      <section class="mt-5" aria-labelledby="titulo-experiencias">
        <h2 id="titulo-experiencias" class="h4 mb-3">Sus experiencias</h2>
        <div id="error-experiencias" class="alert alert-danger d-none" role="alert"></div>
        <div id="sin-experiencias" class="estado-vacio d-none"><img src="/img/vacio-planes.svg" alt="" width="240" height="180"><p>No hay experiencias que puedas ver.</p></div>
        <div id="lista-experiencias" class="rejilla-experiencias"></div>
        <div class="text-center mt-3">
          <button type="button" id="mas-experiencias" class="btn btn-outline-primary d-none">Cargar más experiencias</button>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/shared/experiencias.js"></script>
  <script src="/js/usuario.js"></script>
</body>
</html>
