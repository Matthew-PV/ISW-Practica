<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Solicitudes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  </head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/cuenta/bienvenida.html">PlanB</a>
        <a class="cabecera-enlace" href="/cuenta/bienvenida.html">Inicio</a>
        <a class="cabecera-enlace" href="/social/solicitudes.html" aria-current="page">Solicitudes</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar personas" placeholder="Buscar personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-cuenta">
        <summary><span class="menu-avatar" aria-hidden="true"></span>Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/cuenta/perfil.html">Mi perfil</a>
          <a href="/cuenta/ajustes.html">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <h1 class="mb-4">Solicitudes</h1>

    <!-- Solicitudes de amistad pendientes. js/solicitudes.js las obtiene desde /api/amistades/solicitudes -->
    <div id="error-solicitudes" class="alert alert-danger d-none" role="alert"></div>
    <section aria-labelledby="titulo-solicitudes">
      <h2 id="titulo-solicitudes" class="h5 mb-3">Solicitudes recibidas</h2>
      <p id="sin-solicitudes" class="text-secondary d-none">No tienes solicitudes pendientes.</p>
      <div id="solicitudes-recibidas" class="list-group"></div>
    </section>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/solicitudes.js"></script>
</body>
</html>
