<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Amigos</title>
  <link rel="icon" href="/img/logo-pin.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <link href="/css/perfil.css" rel="stylesheet">
  </head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/cuenta/bienvenida.html"><img src="/img/logo.svg" alt="PlanB" width="112" height="32"></a>
        <a class="cabecera-enlace" href="/cuenta/bienvenida.html">Inicio</a>
        <a class="cabecera-enlace" href="/experiencias/explorar.html">Explorar</a>
        <a class="cabecera-enlace" href="/cuenta/mis-planes.html">Mis planes</a>
        <a class="cabecera-enlace" href="/social/amigos.html" aria-current="page">Amigos</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar planes y personas" placeholder="Planes y personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-notificaciones">
        <summary aria-label="Notificaciones">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span id="contador-notificaciones" class="contador-notificaciones d-none" aria-live="polite"></span>
        </summary>
        <div class="menu-notificaciones-lista">
          <p class="menu-notificaciones-titulo">Notificaciones</p>
          <div id="lista-notificaciones"></div>
          <p id="sin-notificaciones" class="menu-notificaciones-vacio">No tienes notificaciones nuevas.</p>
          <a class="menu-notificaciones-pie" href="/social/amigos.html">Ver amigos y solicitudes</a>
        </div>
      </details>
      <details class="menu-cuenta">
        <summary><img class="menu-avatar" src="/img/foto-por-defecto.svg" alt="" width="32" height="32">Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/cuenta/perfil.html">Mi perfil</a>
          <a href="/cuenta/ajustes.html">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <h1 class="mb-1">Amigos</h1>
    <p class="text-secondary mb-4">Gestiona tus solicitudes y <a href="/social/personas.html">busca a más personas</a>.</p>

    <!-- Solicitudes de amistad pendientes. js/solicitudes.js las obtiene desde /api/amistades/solicitudes -->
    <div id="error-solicitudes" class="alert alert-danger d-none" role="alert"></div>
    <section aria-labelledby="titulo-solicitudes">
      <h2 id="titulo-solicitudes" class="h5 mb-3">Solicitudes recibidas</h2>
      <div id="sin-solicitudes" class="estado-vacio d-none"><img src="/img/vacio-solicitudes.svg" alt="" width="240" height="180"><p>No tienes solicitudes pendientes.</p></div>
      <div id="solicitudes-recibidas" class="list-group"></div>
    </section>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/solicitudes.js"></script>
</body>
</html>
