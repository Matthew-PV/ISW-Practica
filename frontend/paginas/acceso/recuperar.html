<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Recuperar contraseña</title>
  <link rel="icon" href="/img/logo-pin.svg" type="image/svg+xml">
  <link href="/css/nucleo/tokens.css" rel="stylesheet">
  <link href="/css/nucleo/base.css" rel="stylesheet">
  <link href="/css/nucleo/componentes.css" rel="stylesheet">
  <link href="/css/pantallas/acceso.css" rel="stylesheet">
</head>
<body>
  <main id="contenido" class="pantalla-dividida">
    <aside class="pantalla-dividida-marca">
      <a href="/index.html"><img src="/img/logo.svg" alt="PlanB" width="140" height="40"></a>
      <ul class="acceso-lineas">
        <li>Comparte planes por tu ciudad</li>
        <li>Descubre lo que hacen tus amigos</li>
        <li>Confía en quienes conoces</li>
      </ul>
    </aside>

    <div class="pantalla-dividida-formulario">
      <h1 class="mb-4">Recuperar contraseña</h1>
      <p class="text-secondary">Escribe el email de tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.</p>

      <!-- CS-64: pide el enlace (js/acceso/recuperar.js) -->
      <form id="form-recuperar">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required autocomplete="email">
        </div>
        <div id="error-recuperar" class="alert alert-danger d-none" role="alert"></div>
        <div id="exito-recuperar" class="alert alert-success d-none"></div>
        <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
      </form>

      <p class="mt-3 text-center">
        <a href="/paginas/acceso/iniciar-sesion.html">Volver a iniciar sesión</a>
      </p>
    </div>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/acceso/recuperar.js"></script>
  <script src="/js/shared/movimiento.js"></script>
</body>
</html>
