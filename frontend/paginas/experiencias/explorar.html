<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Explorar</title>
  <link rel="icon" href="/img/logo-pin.svg" type="image/svg+xml">
  <link href="/css/nucleo/tokens.css" rel="stylesheet">
  <link href="/css/nucleo/base.css" rel="stylesheet">
  <link href="/css/nucleo/componentes.css" rel="stylesheet">
  <link href="/css/pantallas/descubrir.css" rel="stylesheet">
</head>
<body>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header class="cabecera">
    <div class="cabecera-interior">
      <nav class="cabecera-nav" aria-label="Principal">
        <a class="cabecera-marca" href="/paginas/cuenta/bienvenida.html"><img src="/img/logo.svg" alt="PlanB" width="112" height="32"></a>
        <a class="cabecera-enlace" href="/paginas/cuenta/bienvenida.html">Inicio</a>
        <a class="cabecera-enlace" href="/paginas/experiencias/explorar.html" aria-current="page">Explorar</a>
        <a class="cabecera-enlace" href="/paginas/cuenta/mis-planes.html">Mis planes</a>
        <a class="cabecera-enlace" href="/paginas/social/amigos.html">Amigos</a>
      </nav>
      <form class="cabecera-busqueda" role="search" action="/paginas/social/personas.html" method="get">
        <input type="search" name="q" aria-label="Buscar planes y personas" placeholder="Planes y personas" autocomplete="off">
        <button type="submit" class="btn btn-outline-primary">Buscar</button>
      </form>
      <details class="menu-notificaciones">
        <summary aria-label="Notificaciones">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span id="contador-notificaciones" class="contador-notificaciones d-none" aria-live="polite"></span>
        </summary>
        <div class="menu-notificaciones-lista">
          <p class="menu-notificaciones-titulo">Notificaciones</p>
          <div id="lista-notificaciones"></div>
          <p id="sin-notificaciones" class="menu-notificaciones-vacio">No tienes notificaciones nuevas.</p>
          <a class="menu-notificaciones-pie" href="/paginas/social/amigos.html">Ver amigos y solicitudes</a>
        </div>
      </details>
      <details class="menu-cuenta">
        <summary><img class="menu-avatar" src="/img/foto-por-defecto.svg" alt="" width="32" height="32">Cuenta</summary>
        <div class="menu-cuenta-lista">
          <a href="/paginas/cuenta/perfil.html">Mi perfil</a>
          <a href="/paginas/cuenta/ajustes.html">Ajustes</a>
          <button type="button" id="cerrar-sesion" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </details>
    </div>
  </header>

  <main id="contenido" class="container py-4">
    <h1 class="mb-1" id="titulo-explorar">Explorar</h1>
    <p id="subtitulo-explorar" class="text-secondary mb-3">Experiencias de otras personas para inspirarte.</p>

    <div id="filtros" class="filtros-explorar" role="group" aria-label="Filtrar por categoría"></div>
    <div class="filtros-explorar-campos">
      <div>
        <label for="filtro-momento" class="form-label small mb-1">Momento adecuado</label>
        <select id="filtro-momento" class="form-select form-select-sm"><option value="">Cualquiera</option></select>
      </div>
      <div>
        <label for="filtro-ciudad" class="form-label small mb-1">Ciudad</label>
        <select id="filtro-ciudad" class="form-select form-select-sm"><option value="">Todas</option></select>
      </div>
      <div class="form-check">
        <input id="filtro-amigos" type="checkbox" class="form-check-input">
        <label for="filtro-amigos" class="form-check-label">Solo experiencias de mis amigos</label>
      </div>
    </div>
    <p id="total-planes" class="small text-secondary" role="status"></p>
    <div id="error-planes" class="alert alert-danger d-none" role="alert"></div>
    <h2 class="visually-hidden">Experiencias</h2>
    <div id="resultados" class="rejilla-planes"></div>
    <div id="sin-resultados" class="estado-vacio d-none"><img src="/img/vacio-planes.svg" alt="" width="240" height="180"><p>No hay experiencias con estos filtros.</p></div>
    <div class="text-center mt-4"><button type="button" id="mas-planes" class="btn btn-outline-primary d-none">Cargar más</button></div>
  </main>

  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/pantalla.js"></script>
  <script src="/js/shared/planes.js"></script>
  <script src="/js/shared/cabecera.js"></script>
  <script src="/js/experiencias/explorar.js"></script>
  <script src="/js/shared/movimiento.js"></script>
</body>
</html>
