<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Perfil de usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-sesion">
  <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>
  <nav class="barra-sesion" aria-label="Navegación principal">
    <div class="container">
      <a class="marca-planb" href="bienvenida.html">PlanB</a>
      <div class="navegacion-sesion">
        <a href="bienvenida.html">Inicio</a>
        <a href="personas.html">Buscar personas</a>
        <a href="perfil.html">Mi perfil</a>
      </div>
    </div>
  </nav>

  <main id="contenido-principal" class="container pagina-perfil-publico" tabindex="-1">
    <!-- Se muestra solo si el usuario no existe (js/usuario.js) -->
    <div id="no-encontrado" class="alert alert-warning text-center d-none">Usuario no encontrado</div>

    <p id="cargando" class="text-secondary text-center" role="status">Cargando…</p>

    <!-- Los datos se rellenan desde js/usuario.js con el perfil que devuelve el backend; hasta entonces no se muestra -->
    <div id="perfil-usuario" class="rejilla-perfil-publico d-none">
      <section class="tarjeta-perfil-publico">
        <img id="foto-usuario" src="img/foto-por-defecto.svg" alt="Foto de perfil" class="foto-perfil-publico" width="120" height="120">
        <h1 id="nombre-usuario"></h1>
        <p id="ciudad" class="texto-suave"></p>
        <p class="resumen-relaciones">
          <strong id="amigos">0</strong> amigos · <strong id="seguidores">0</strong> seguidores
        </p>
        <!-- Los botones de amistad los crea js/usuario.js según la relación con este usuario -->
        <div id="botones-amistad" class="acciones-perfil"></div>
        <!-- El botón de seguir lo crea js/usuario.js; seguir no depende de la amistad -->
        <div id="boton-seguir" class="acciones-perfil"></div>
        <div id="error-usuario" role="alert" class="alert alert-danger d-none"></div>
      </section>

      <!-- CS-44: sus experiencias que puedo ver; las pinta js/shared/experiencias.js -->
      <section class="bloque-experiencias-publicas" aria-labelledby="titulo-experiencias">
        <h2 id="titulo-experiencias" class="h4">Sus experiencias</h2>
        <div id="error-experiencias" class="alert alert-danger d-none" role="alert"></div>
        <p id="sin-experiencias" class="texto-suave d-none">No hay experiencias que puedas ver.</p>
        <div id="lista-experiencias" class="lista-experiencias-social"></div>
        <button type="button" id="mas-experiencias" class="btn boton-secundario d-none">Cargar más experiencias</button>
      </section>
    </div>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/pantalla.js"></script>
  <script src="js/shared/experiencias.js"></script>
  <script src="js/usuario.js"></script>
</body>
</html>
