<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Perfil de usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PlanB</a>
      <div class="d-flex gap-3">
        <a class="nav-link text-light" href="personas.html">Buscar personas</a>
        <a class="nav-link text-light" href="bienvenida.html">Volver</a>
      </div>
    </div>
  </nav>

  <main class="container contenedor-formulario py-5">
    <!-- Se muestra solo si el usuario no existe (js/usuario.js) -->
    <div id="no-encontrado" class="alert alert-warning text-center d-none">Usuario no encontrado</div>

    <!-- Los datos se rellenan desde js/usuario.js con el perfil que devuelve el backend -->
    <div id="perfil-usuario" class="text-center">
      <img id="foto-usuario" src="img/foto-por-defecto.svg" alt="Foto de perfil" class="rounded-circle mb-3" width="120" height="120">
      <h1 id="nombre-usuario" class="h3"></h1>
      <p id="ciudad" class="text-secondary"></p>
      <p>
        <strong id="amigos">0</strong> amigos ·
        <strong id="seguidores">0</strong> seguidores
      </p>
      <!-- Los botones de amistad los crea js/usuario.js según la relación con este usuario -->
      <div id="botones-amistad" class="d-flex justify-content-center gap-2 mb-3"></div>
      <!-- El botón de seguir lo crea js/usuario.js; seguir no depende de la amistad -->
      <div id="boton-seguir" class="d-flex justify-content-center mb-3"></div>
      <div id="error-usuario" class="alert alert-danger d-none"></div>

      <!-- CS-44: sus experiencias que puedo ver; las pinta js/shared/experiencias.js -->
      <section class="mt-5 text-start" aria-labelledby="titulo-experiencias">
        <h2 id="titulo-experiencias" class="h4">Sus experiencias</h2>
        <div id="error-experiencias" class="alert alert-danger d-none" role="alert"></div>
        <p id="sin-experiencias" class="text-secondary d-none">No hay experiencias que puedas ver.</p>
        <div id="lista-experiencias" class="list-group"></div>
        <button type="button" id="mas-experiencias" class="btn btn-outline-secondary btn-sm mt-2 d-none">Cargar más experiencias</button>
      </section>
    </div>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/shared/experiencias.js"></script>
  <script src="js/usuario.js"></script>
</body>
</html>
