<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlanB · Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="pagina-acceso">
  <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido</a>
  <nav class="barra-acceso" aria-label="Acceso">
    <div class="container">
      <a class="marca-planb" href="index.html">PlanB</a>
    </div>
  </nav>

  <main id="contenido-principal" class="container contenedor-formulario pagina-acceso-contenido" tabindex="-1">
    <section class="tarjeta-formulario" aria-labelledby="titulo-login">
    <p class="presentacion-acceso">Comparte y descubre planes por tu ciudad.</p>
    <h1 id="titulo-login">Iniciar sesión</h1>

    <form id="form-login">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div id="error-login" role="alert" class="alert alert-danger d-none"></div>
      <button type="submit" class="btn boton-principal w-100">Entrar</button>
    </form>

    <!-- CS-64: recuperar la contraseña por email -->
    <p class="mt-3 text-center">
      <a class="enlace-acceso" href="recuperar.html">¿Has olvidado tu contraseña?</a>
    </p>

    <p class="mt-3 text-center">
      ¿No tienes cuenta?
    </p>
    <a href="registro.html" class="btn boton-secundario w-100">Crear cuenta</a>
    </section>
  </main>

  <script src="js/shared/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
