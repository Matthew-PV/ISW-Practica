<!doctype html>
<html lang="es">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>PlanB · Detalle de Experiencia</title>

      <!-- CSS de Bootstrap (Visual) -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

      <!-- SCRIPT de Bootstrap (Motor para Modales) - LO MOVEMOS AQUÍ ARRIBA -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

      <link href="css/styles.css" rel="stylesheet">
    </head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="bienvenida.html">⬅ Volver a Bienvenida</a>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Contenedor de mensajes de error o carga (Objetivo 9) -->
    <div id="mensaje-estado" class="alert alert-info">Cargando experiencia...</div>

    <!-- Contenido de la experiencia -->
    <div id="contenido-experiencia" class="d-none">
      <h1 id="detalle-titulo" class="h3 mb-2"></h1>
      <p class="text-muted mb-4">
        Por <strong id="detalle-autor"></strong> en <span id="detalle-ciudad"></span>
      </p>

      <p id="detalle-descripcion" class="fs-5"></p>

      <hr class="my-5">

      <hr class="my-5">

            <!-- OBJETIVO 5: Formulario de valoración -->
      <div id="caja-formulario-valoracion" class="card mb-5 border-0 shadow-sm bg-light d-none">
              <div class="card-body">
                <h2 class="h6 mb-3">Deja tu valoración</h2>
                <form id="form-valoracion">
                  <div class="mb-3">
                    <label for="val-puntuacion" class="form-label fw-bold">Puntuación (1 al 5) *</label>
                    <input type="number" class="form-control" id="val-puntuacion" min="1" max="5" required style="max-width: 100px;">
                  </div>

                  <div class="mb-3">
                    <label for="val-comentario" class="form-label fw-bold">Comentario (opcional)</label>
                    <textarea class="form-control" id="val-comentario" rows="3" maxlength="255"></textarea>
                    <!-- Contador de caracteres -->
                    <div id="contador-caracteres" class="form-text text-end text-muted mt-1">0 / 255</div>
                  </div>

                  <div id="error-valoracion" class="alert alert-danger d-none small p-2 mb-3"></div>

                  <button type="submit" class="btn btn-primary" id="btn-guardar-valoracion">Guardar</button>
                </form>
              </div>
            </div>

            <!-- Objetivo 4: Lista de valoraciones y comentarios -->
            <h2 class="h5 mb-4">Valoraciones y comentarios</h2>

            <!-- Mensaje si no hay valoraciones -->
            <p id="sin-comentarios" class="text-muted d-none">Todavía no hay valoraciones</p>

            <!-- Contenedor donde se insertarán los comentarios -->
            <div id="lista-comentarios" class="d-flex flex-column gap-3 mb-4"></div>

            <!-- Botón Cargar más -->
            <div class="text-center">
              <button id="btn-cargar-mas" class="btn btn-outline-primary d-none">
                Cargar más
              </button>
            </div>
          </div>
      <div id="lista-comentarios"></div>
    </div>
  </main>

  <!-- OBJETIVO 8: Modal de Reporte -->
    <div class="modal fade" id="modal-reporte" tabindex="-1" aria-labelledby="modalReporteLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalReporteLabel">Reportar comentario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p>Selecciona el motivo por el que deseas reportar este comentario:</p>
            <form id="form-reporte">
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="motivoReporte" id="motivoSpam" value="SPAM" required>
                <label class="form-check-label" for="motivoSpam">Spam o publicidad</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="motivoReporte" id="motivoOfensivo" value="OFENSIVO">
                <label class="form-check-label" for="motivoOfensivo">Contenido ofensivo o insultante</label>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="motivoReporte" id="motivoInapropiado" value="INAPROPIADO">
                <label class="form-check-label" for="motivoInapropiado">Inapropiado u off-topic</label>
              </div>

              <!-- Aquí mostraremos el aviso de éxito o si ya estaba reportado -->
              <div id="mensaje-reporte" class="alert d-none small"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" form="form-reporte" class="btn btn-danger" id="btn-enviar-reporte">Enviar reporte</button>
          </div>
        </div>
      </div>
    </div>


  <script src="js/shared/api.js"></script>
  <script src="js/experiencia.js"></script>

  <!-- Script de Bootstrap necesario para los modales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/shared/api.js"></script>
    <script src="js/experiencia.js"></script>
  </body>
  </html>
