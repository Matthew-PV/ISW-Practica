<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img"><title>iniciar-sesion.html: iniciar sesión</title><desc>Escritorio, pantalla dividida: a la izquierda la marca y tres frases; a la derecha el formulario con email, contraseña, «Entrar», enlace de contraseña olvidada, «Crear cuenta» y avisos de error y espera.</desc><rect width="680" height="450" fill="#fff" /><rect x="20" y="30" width="640" height="370" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/iniciar-sesion.html</text><line x1="320" y1="52" x2="320" y2="400" stroke="#000" stroke-width="1" /><text x="50" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="50" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Comparte planes por tu ciudad</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Descubre lo que hacen tus amigos</text><text x="50" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Confía en quienes conoces</text><text x="360" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Iniciar sesión</text><text x="360" y="124" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Email</text><rect x="360" y="128" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><text x="360" y="172" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Contraseña</text><rect x="360" y="176" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><text x="360" y="218" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">¿Has olvidado tu contraseña?</text><line x1="360" y1="220" x2="491.6" y2="220" stroke="#000" stroke-width="1" /><rect x="360" y="230" width="260" height="26" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="247" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de error (por ejemplo, credenciales incorrectas)</text><rect x="360" y="268" width="260" height="28" rx="5" fill="#000" stroke="#000" stroke-width="1" /><text x="490" y="286" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#fff">Entrar</text><text x="490" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">¿No tienes cuenta?</text><rect x="360" y="326" width="260" height="28" rx="5" fill="#fff" stroke="#000" stroke-width="1" /><text x="490" y="344" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Crear cuenta</text><rect x="360" y="364" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="380" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Mientras se envía: «Entrando…»</text><rect x="20" y="415" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1" /><text x="48" y="425" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro</text><circle cx="117" cy="421" r="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="133" y="425" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Círculo (foto)</text><line x1="205" y1="421" x2="229" y2="421" stroke="#000" stroke-width="1" /><text x="233" y="425" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Línea (texto)</text><rect x="305" y="415" width="24" height="12" fill="#fff" stroke="#999" stroke-width="1" /><line x1="305" y1="415" x2="329" y2="427" stroke="#999" stroke-width="1" /><line x1="329" y1="415" x2="305" y2="427" stroke="#999" stroke-width="1" /><text x="333" y="425" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro con X (imagen)</text><rect x="440" y="415" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" /><text x="468" y="425" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Botón</text><rect x="505" y="415" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="533" y="425" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Trazo discontinuo (dinámico)</text></svg>
