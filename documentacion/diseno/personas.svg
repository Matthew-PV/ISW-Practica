<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 634" width="680" height="634" role="img"><title>personas.html: Buscar</title><desc>Pantalla Buscar de escritorio: cabecera con sesión sin el campo de búsqueda, título Buscar, campo grande con el botón Buscar, pestañas Personas y Experiencias y filas con foto, nombre y ciudad (como mucho 20). Aparte, los estados antes de buscar, sin resultados, Experiencias vacía, Cargando y error.</desc><rect width="680" height="634" fill="#fff" /><rect x="20" y="30" width="640" height="362" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/personas.html</text><rect x="20" y="52" width="640" height="30" fill="#fff" stroke="#000" stroke-width="1" /><text x="30" y="71" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="520" y="71" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Inicio</text><circle cx="564" cy="67" r="9" fill="#fff" stroke="#999" stroke-width="1" /><text x="578" y="71" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Cuenta</text><path d="M620 65 l8 0 l-4 5 z" fill="#000" stroke="#000" stroke-width="1" /><text x="100" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#000" font-weight="bold">Buscar</text><text x="100" y="134" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"