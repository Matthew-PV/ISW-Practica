family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">anabel</text><text x="144" y="347" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">Valencia</text><text x="100" y="372" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">Como mucho 20 resultados, con fundido de 150 ms al entrar</text><text x="20" y="428" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">Otros estados del panel (la cabecera y el campo no cambian)</text><rect x="20" y="440" width="205" height="62" rx="5" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="28" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000" font-weight="bold">Antes de buscar</text><text x="28" y="474" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Escribe parte de un nombre.</text><rect x="237" y="440" width="205" height="62" rx="5" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="245" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000" font-weight="bold">Sin resultados</text><text x="245" y="474" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">No se han encontrado personas.</text><rect x="454" y="440" width="205" height="62" rx="5" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="462" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000" font-weight="bold">Pestaña Experiencias, vacía</text><text x="462" y="474" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Todavía no hay experiencias</text><text x="462" y="487" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">que