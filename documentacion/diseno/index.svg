<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" role="img"><title>index.html: página de presentación de PlanB</title><desc>Escritorio, página pública y estática: cabecera sin sesión con «Iniciar sesión» y «Crear cuenta», portada con titular, subtítulo y marco de captura, tres bloques (Comparte, Descubre, Confía en tus amigos), cómo funciona en tres pasos, cierre con los dos botones y pie.</desc><rect width="680" height="650" fill="#fff" /><rect x="20" y="30" width="640" height="570" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/</text><line x1="20" y1="82" x2="660" y2="82" stroke="#000" stroke-width="1" /><text x="36" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><rect x="452" y="58" width="96" height="22" rx="5" fill="#fff" stroke="#000" stroke-width="1" /><text x="500" y="73" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Iniciar sesión</text><rect x="556" y="58" width="90" height="22" rx="5" fill="#fff" stroke="#000" stroke-width="1" /><text x="601" y="73" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Crear cuenta</text><text x="50" y="138" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start" fill="#000" font-weight="bold">Comparte y descubre</text><text x="50" y="164" font-family="Arial, Helvetica, sans-serif" font-siz