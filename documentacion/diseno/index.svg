<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" width="680" height="484" role="img"><title>index.html: iniciar sesión</title><desc>Inicio de sesión con una frase de presentación, el formulario y un botón visible para crear cuenta. Móvil y escritorio.</desc><rect width="680" height="484" fill="#fff"/><text x="105" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000">Móvil 375 px</text><rect x="10" y="30" width="190" height="400" rx="14" fill="#fff" stroke="#000" stroke-width="1"/><rect x="10" y="30" width="190" height="28" rx="14" fill="#fff" stroke="#000" stroke-width="1"/><text x="20" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="105" y="72" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">Comparte y descubre</text><text x="105" y="83" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">planes por tu ciudad</text><text x="105" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Iniciar sesión</text><text x="22" y="122" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Email</text><rect x="22" y="127" width="166" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="22" y="168" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Contraseña</text><rect x="22" y="173" width="166" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><rect x="22" y="210" width="166" height="22" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="30" y="225" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de error, si falla</text><rect x="22" y="242" width="166" height="30" rx="8" fill="#000" stroke="#000" stroke-width="1"/><text x="105.0" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Entrar</text><text x="105" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">¿Has olvidado tu contraseña?</text><line x1="22" y1="304" x2="188" y2="304" stroke="#000" stroke-width="1"/><text x="105" y="322" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">¿No tienes cuenta?</text><rect x="22" y="330" width="166" height="30" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><text x="105.0" y="349.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Crear cuenta</text><text x="450" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000">Escritorio 1280 px</text><rect x="230" y="30" width="440" height="400" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><rect x="230" y="30" width="440" height="28" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><text x="242" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><rect x="350" y="66" width="200" height="352" rx="12" fill="#fff" stroke="#000" stroke-width="1"/><text x="450" y="74" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">Comparte y descubre</text><text x="450" y="85" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">planes por tu ciudad</text><text x="450" y="102" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Iniciar sesión</text><text x="364" y="124" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Email</text><rect x="364" y="129" width="172" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="364" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Contraseña</text><rect x="364" y="175" width="172" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><rect x="364" y="212" width="172" height="22" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="372" y="227" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de error, si falla</text><rect x="364" y="244" width="172" height="30" rx="8" fill="#000" stroke="#000" stroke-width="1"/><text x="450.0" y="263.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">Entrar</text><text x="450" y="294" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">¿Has olvidado tu contraseña?</text><line x1="364" y1="306" x2="536" y2="306" stroke="#000" stroke-width="1"/><text x="450" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">¿No tienes cuenta?</text><rect x="364" y="332" width="172" height="30" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><text x="450.0" y="351.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Crear cuenta</text><text x="450" y="452" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Sin sesión: la barra solo lleva el nombre PlanB</text><text x="450" y="468" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">«Crear cuenta» es un botón visible, no un enlace; la frase de presentación es un texto de ejemplo</text></svg>
