oke-width="1" /><text x="333" y="625" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro con X (imagen)</text><rect x="440" y="615" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" /><text x="468" y="625" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Botón</text><rect x="505" y="615" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="533" y="625" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Trazo discontinuo (dinámico)</text></svg>
