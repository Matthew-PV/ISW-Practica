<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 550" width="680" height="550" role="img"><title>registro.html: crear cuenta</title><desc>Escritorio, pantalla dividida: a la izquierda la marca y tres frases; a la derecha el formulario de registro con nombre de usuario, email, contraseña, lista de requisitos de contraseña, CAPTCHA de 300 px, aviso de error y «Crear cuenta».</desc><rect width="680" height="550" fill="#fff" /><rect x="20" y="30" width="640" height="470" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/registro.html</text><line x1="320" y1="52" x2="320" y2="500" stroke="#000" stroke-width="1" /><text x="50" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="50" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Comparte planes por tu ciudad</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Descubre lo que hacen tus amigos</text><text x="50" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Confía en quienes conoces</text><text x="360" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Crear cuenta</text><text x="360" y="110" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Nombre de usuario</text><rect x="360" y="114" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><text x="360" y="154" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Email</text><rect x="360" y="158" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><text x="360" y="198" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Contraseña</text><rect x="360" y="202" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><rect x="360" y="234" width="260" height="72" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><rect x="368" y="242" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="249" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">entre 8 y 72 caracteres</text><rect x="368" y="254" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="261" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">al menos una mayúscula</text><rect x="368" y="266" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="273" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">al menos una minúscula</text><rect x="368" y="278" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="285" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">al menos un número</text><rect x="368" y="290" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="297" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">sin el nombre de usuario</text><rect x="360" y="318" width="150" height="33" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="435" y="338" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#000">CAPTCHA (300 px)</text><rect x="360" y="360" width="260" height="26" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="377" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de error</text><rect x="360" y="396" width="260" height="28" rx="5" fill="#000" stroke="#000" stroke-width="1" /><text x="490" y="414" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#fff">Crear cuenta</text><rect x="360" y="432" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="448" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Mientras se envía: «Creando cuenta…»</text><text x="360" y="476" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">¿Ya tienes cuenta?</text><text x="460" y="476" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Inicia sesión</text><line x1="460" y1="478" x2="521.1" y2="478" stroke="#000" stroke-width="1" /><rect x="20" y="515" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1" /><text x="48" y="525" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro</text><circle cx="117" cy="521" r="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="133" y="525" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Círculo (foto)</text><line x1="205" y1="521" x2="229" y2="521" stroke="#000" stroke-width="1" /><text x="233" y="525" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Línea (texto)</text><rect x="305" y="515" width="24" height="12" fill="#fff" stroke="#999" stroke-width="1" /><line x1="305" y1="515" x2="329" y2="527" stroke="#999" stroke-width="1" /><line x1="329" y1="515" x2="305" y2="527" stroke="#999" stroke-width="1" /><text x="333" y="525" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro con X (imagen)</text><rect x="440" y="515" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" /><text x="468" y="525" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Botón</text><rect x="505" y="515" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="533" y="525" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Trazo discontinuo (dinámico)</text></svg>
