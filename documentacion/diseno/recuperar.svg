<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" width="680" height="416" role="img"><title>recuperar.html: recuperar contraseña</title><desc>Escritorio, pantalla dividida: a la izquierda la marca y tres frases; a la derecha el formulario con el email, «Enviar enlace», avisos de éxito y error, y el enlace para volver a iniciar sesión.</desc><rect width="680" height="416" fill="#fff" /><rect x="20" y="30" width="640" height="336" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/recuperar.html</text><line x1="320" y1="52" x2="320" y2="366" stroke="#000" stroke-width="1" /><text x="50" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="50" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Comparte planes por tu ciudad</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Descubre lo que hacen tus amigos</text><text x="50" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Confía en quienes conoces</text><text x="360" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Recuperar contraseña</text><text x="360" y="114" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Escribe el email de tu cuenta y te enviaremos</text><text x="360" y="128" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">un enlace para elegir una contraseña nueva.</text><text x="360" y="154" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Email</text><rect x="360" y="158" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><rect x="360" y="194" width="260" height="36" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="209" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de éxito: siempre el mismo,</text><text x="368" y="222" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">exista o no la cuenta</text><rect x="360" y="238" width="260" height="26" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="255" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de error</text><rect x="360" y="276" width="260" height="28" rx="5" fill="#000" stroke="#000" stroke-width="1" /><text x="490" y="294" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#fff">Enviar enlace</text><text x="438" y="328" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Volver a iniciar sesión</text><line x1="438" y1="330" x2="546.1" y2="330" stroke="#000" stroke-width="1" /><rect x="20" y="381" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1" /><text x="48" y="391" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro</text><circle cx="117" cy="387" r="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="133" y="391" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Círculo (foto)</text><line x1="205" y1="387" x2="229" y2="387" stroke="#000" stroke-width="1" /><text x="233" y="391" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Línea (texto)</text><rect x="305" y="381" width="24" height="12" fill="#fff" stroke="#999" stroke-width="1" /><line x1="305" y1="381" x2="329" y2="393" stroke="#999" stroke-width="1" /><line x1="329" y1="381" x2="305" y2="393" stroke="#999" stroke-width="1" /><text x="333" y="391" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro con X (imagen)</text><rect x="440" y="381" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" /><text x="468" y="391" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Botón</text><rect x="505" y="381" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="533" y="391" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Trazo discontinuo (dinámico)</text></svg>
