<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" role="img"><title>restablecer.html: elegir una contraseña nueva</title><desc>Escritorio, pantalla dividida: a la izquierda la marca y tres frases; a la derecha el formulario con contraseña nueva, requisitos, repetición, aviso de error y «Guardar contraseña», más los estados de final y de enlace no válido.</desc><rect width="680" height="510" fill="#fff" /><rect x="20" y="30" width="640" height="430" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/restablecer.html?token=…</text><line x1="320" y1="52" x2="320" y2="460" stroke="#000" stroke-width="1" /><text x="50" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="50" y="160" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Comparte planes por tu ciudad</text><text x="50" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Descubre lo que hacen tus amigos</text><text x="50" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Confía en quienes conoces</text><text x="360" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Elige una contraseña nueva</text><text x="360" y="110" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Contraseña nueva</text><rect x="360" y="114" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><rect x="360" y="148" width="260" height="72" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><rect x="368" y="156" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="163" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">entre 8 y 72 caracteres</text><rect x="368" y="168" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="175" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">al menos una mayúscula</text><rect x="368" y="180" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="187" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">al menos una minúscula</text><rect x="368" y="192" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="199" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">al menos un número</text><rect x="368" y="204" width="6" height="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="380" y="211" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#000">sin el nombre de usuario</text><text x="360" y="244" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Repite la contraseña nueva</text><rect x="360" y="248" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" /><rect x="360" y="286" width="260" height="26" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="303" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Aviso de error (por ejemplo, no coinciden)</text><rect x="360" y="322" width="260" height="28" rx="5" fill="#000" stroke="#000" stroke-width="1" /><text x="490" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#fff">Guardar contraseña</text><rect x="360" y="362" width="260" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="378" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Al terminar: aviso y enlace</text><text x="508" y="378" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Iniciar sesión</text><line x1="508" y1="380" x2="573.8" y2="380" stroke="#000" stroke-width="1" /><rect x="360" y="394" width="260" height="36" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="368" y="409" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Sin enlace válido: solo un aviso</text><text x="368" y="422" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">y el formulario oculto</text><rect x="20" y="475" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1" /><text x="48" y="485" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro</text><circle cx="117" cy="481" r="6" fill="#fff" stroke="#999" stroke-width="1" /><text x="133" y="485" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Círculo (foto)</text><line x1="205" y1="481" x2="229" y2="481" stroke="#000" stroke-width="1" /><text x="233" y="485" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Línea (texto)</text><rect x="305" y="475" width="24" height="12" fill="#fff" stroke="#999" stroke-width="1" /><line x1="305" y1="475" x2="329" y2="487" stroke="#999" stroke-width="1" /><line x1="329" y1="475" x2="305" y2="487" stroke="#999" stroke-width="1" /><text x="333" y="485" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Recuadro con X (imagen)</text><rect x="440" y="475" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" /><text x="468" y="485" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Botón</text><rect x="505" y="475" width="24" height="12" rx="3" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="533" y="485" font-family="Arial, Helvetica, sans-serif" font-size="8" text-anchor="start" fill="#000">Trazo discontinuo (dinámico)</text></svg>
