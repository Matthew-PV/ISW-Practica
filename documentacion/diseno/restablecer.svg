<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img"><title>restablecer.html: elegir una contraseña nueva</title><desc>Pantalla con dos campos de contraseña, requisitos y estados de error y de enlace no válido. Móvil y escritorio.</desc><rect width="680" height="410" fill="#fff"/><text x="105" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000">Móvil 375 px</text><text x="450" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000">Escritorio 1280 px</text><rect x="10" y="30" width="190" height="340" rx="14" fill="#fff" stroke="#000" stroke-width="1"/><rect x="10" y="30" width="190" height="28" rx="14" fill="#fff" stroke="#000" stroke-width="1"/><text x="20" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="105.0" y="94" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Elige una contraseña nueva</text><text x="22" y="110" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Contraseña nueva</text><rect x="22" y="115" width="166" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="22" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Repite la contraseña</text><rect x="22" y="157" width="166" height="24" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><rect x="22" y="192" width="166" height="36" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="30" y="208" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Requisitos de la contraseña</text><text x="30" y="222" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">(se marcan al escribir)</text><rect x="22" y="236" width="166" heig