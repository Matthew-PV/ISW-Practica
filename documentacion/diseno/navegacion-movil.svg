<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" width="680" height="514" role="img"><title>Navegación: barra inferior en móvil y barra superior en escritorio</title><desc>Propuesta recomendada de navegación con sus medidas y reglas, y la alternativa descartada del menú desplegable.</desc><rect width="680" height="514" fill="#fff"/><text x="95" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Móvil (menos de 768 px)</text><text x="95" y="34" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">Barra inferior · recomendada</text><rect x="10" y="44" width="170" height="300" rx="14" fill="#fff" stroke="#000" stroke-width="1"/><rect x="10" y="44" width="170" height="28" rx="14" fill="#fff" stroke="#000" stroke-width="1"/><text x="22" y="63" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="95" y="190" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">contenido de la página</text><line x1="10" y1="288" x2="180" y2="288" stroke="#000" stroke-width="1"/><line x1="66.66666666666666" y1="294" x2="66.66666666666666" y2="338" stroke="#000" stroke-width="1"/><line x1="123.33333333333333" y1="294" x2="123.33333333333333" y2="338" stroke="#000" stroke-width="1"/><text x="38.33333333333333" y="321" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Inicio</text><text x="95.0" y="321" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Buscar</text><text x="151.66666666666666" y="321" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">Perfil</text><line x1="16" y1="289.5" x2="60.66666666666666" y2="289.5" stroke="#000" stroke-width="3"/><text x="435" y="20" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#000" font-weight="bold">Escritorio (768 px o más)</text><text x="435" y="34" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#000">Barra superior con los tres enlaces</text><rect x="200" y="44" width="470" height="200" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><rect x="200" y="44" width="470" height="32" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><text x="214" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="466" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#000" font-weight="bold">Inicio</text><line x1="430" y1="71" x2="466" y2="71" stroke="#000" stroke-width="3"/><text x="578" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#000">Buscar personas</text><text x="654" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" fill="#000">Mi perfil</text><text x="435" y="165" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000">contenido de la página</text><text x="265" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Descartada: menú ≡</text><rect x="200" y="278" width="130" height="66" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><rect x="200" y="278" width="130" height="22" rx="8" fill="#fff" stroke="#000" stroke-width="1"/><text x="210" y="293" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><text x="320" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#000">≡</text><rect x="212" y="306" width="106" height="16" rx="3" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="265" y="318" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#000">Inicio · Buscar · Perfil</text><text x="10" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000" font-weight="bold">Reglas</text><text x="10" y="394" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Barra inferior: tres destinos siempre visibles y al alcance del pulgar. Son enlaces normales, sin JavaScript.</text><text x="10" y="410" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Cada zona mide al menos 44 × 44 px (la barra, 56 px de alto) y respeta la zona segura del móvil.</text><text x="10" y="426" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Página activa: línea gruesa y etiqueta en negrita, no solo color, y aria-current="page" en el enlace.</text><text x="10" y="442" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">El contenido lleva un margen inferior igual a la altura de la barra, para que no tape lo último.</text><text x="10" y="458" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">La barra es un elemento nav con aria-label="Principal"; con el teclado el foco se ve con un contorno.</text><text x="10" y="474" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Desde 768 px la barra inferior se oculta y los tres enlaces pasan a la barra superior.</text><text x="10" y="490" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Solo en las pantallas con sesión: inicio de sesión, registro y recuperar no la llevan.</text><text x="350" y="290" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Esconde la navegación: hace falta un toque más.</text><text x="350" y="306" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Con &lt;details&gt; iría sin JavaScript, pero los tres</text><text x="350" y="322" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">destinos ya caben en la barra inferior.</text><text x="350" y="338" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000">Queda como alternativa si el equipo la prefiere.</text></svg>
