<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 454" width="680" height="454" role="img"><title>terminos.html: Términos y privacidad</title><desc>Esquema de escritorio de Términos y privacidad, en color y con contenido de ejemplo.</desc><rect width="680" height="454" fill="#EFEAF5"/><rect x="20" y="20" width="640" height="414" rx="10" fill="#FFFFFF" stroke="#E4DEEC"/><path d="M20 30a10 10 0 0 1 10-10h620a10 10 0 0 1 10 10V50H20z" fill="#F6F3F9"/><line x1="20" y1="50" x2="660" y2="50" stroke="#E4DEEC" stroke-width="1"/><circle cx="34" cy="35" r="3.5" fill="#FF8A70"/><circle cx="46" cy="35" r="3.5" fill="#FFD08A"/><circle cx="58" cy="35" r="3.5" fill="#9AD9A8"/><rect x="76" y="27" width="560" height="16" rx="8" fill="#FFFFFF" stroke="#E4DEEC" stroke-width="1"/><text x="88" y="38.5" font-family="system-ui, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5E5470">localhost:3000/terminos.html</text><rect x="21" y="52" width="638" height="36" rx="0" fill="#FFFFFF"/><line x1="21" y1="88" x2="659" y2="88" stroke="#E4DEEC" stroke-width="1"/><g transform="translate(36 60) scale(0.9)"><path d="M8 0C3.6 0 0 3.5 0 7.9 0 13.6 8 22 8 22s8-8.4 8-14.1C16 3.5 12.4 0 8 0z" fill="#FF5A36"/><circle cx="8" cy="8" r="3" fill="#2A1E3F"/></g><text x="56" y="75" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#2A1E3F">plan</text><text x="90" y="75" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="start" fill="#FF5A36">B</text><rect x="484" y="57" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#2A1E3F" stroke-width="1"/><text x="526.0" y="74.0" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2A1E3F">Iniciar sesión</text><rect x="574" y="57" width="78" height="26" rx="13" fill="#FF5A36"/><text x="613.0" y="74.0" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2A1E3F">Crear cuenta</text><text x="40" y="124" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="start" fill="#2A1E3F">Términos y privacidad</text><rect x="40" y="138" width="164" height="32" rx="16" fill="#FFFFFF" stroke="#E4DEEC" stroke-width="1"/><rect x="44" y="142" width="72" height="24" rx="12" fill="#FF5A36"/><text x="80.0" y="158" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2A1E3F">Términos</text><text x="158.0" y="158" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#5E5470">Privacidad</text><text x="40" y="206" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2A1E3F">1. Quiénes somos</text><text x="40" y="226" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5470">PlanB es una plataforma para compartir planes con tus amigos. Al crear una cuenta aceptas</text><text x="40" y="242" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5470">estas condiciones. Puedes eliminar tu cuenta en cualquier momento desde Ajustes.</text><text x="40" y="276" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="800" text-anchor="start" fill="#2A1E3F">2. Tus datos</text><text x="40" y="296" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5470">Guardamos tu email, nombre de usuario y los planes que publicas. Tú decides quién</text><text x="40" y="312" font-family="system-ui, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#5E5470">ve cada plan; nunca mostramos tu email a otras personas.</text><rect x="40" y="350" width="600" height="26" rx="6" fill="#E0F2FE"/><text x="50" y="367" font-family="system-ui, Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start" fill="#0C4A6E">Texto legal pendiente de revisión: este es un texto de ejemplo.</text><rect x="21" y="398" width="638" height="28" rx="0" fill="#F6F3F9"/><line x1="21" y1="398" x2="659" y2="398" stroke="#E4DEEC" stroke-width="1"/><text x="40" y="416" font-family="system-ui, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#5E5470">© 2026 PlanB</text><text x="540" y="416" font-family="system-ui, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end" fill="#C2410C">Ayuda</text><text x="640" y="416" font-family="system-ui, Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end" fill="#C2410C">Términos y privacidad</text></svg>