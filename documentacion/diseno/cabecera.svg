<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img"><title>Cabecera con sesión</title><desc>Cabecera de escritorio con sesión: marca PlanB a la izquierda, buscador en píldora con botón Buscar al centro, Inicio y menú de cuenta con avatar, texto Cuenta y flecha a la derecha. Se muestra en reposo, con el menú abierto (Mi perfil y Cerrar sesión), sin campo en la página Buscar y con el enlace Saltar al contenido.</desc><rect width="680" height="436" fill="#fff" /><rect x="20" y="30" width="640" height="356" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><line x1="20" y1="52" x2="660" y2="52" stroke="#000" stroke-width="1" /><circle cx="32" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="44" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><circle cx="56" cy="41" r="3" fill="#fff" stroke="#999" stroke-width="1" /><rect x="70" y="34" width="570" height="14" rx="4" fill="#fff" stroke="#999" stroke-width="1" /><text x="78" y="44" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="start" fill="#999">localhost:3000/bienvenida.html</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000" font-weight="bold">1. En reposo, con «Inicio» como sección activa</text><rect x="20" y="76" width="640" height="30" fill="#fff" stroke="#000" stroke-width="1" /><text x="30" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><rect x="245" y="81" width="190" height="20" rx="10" fill="#fff" stroke="#000" stroke-width="1" /><text x="255" y="95" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#999">Buscar personas</text><rect x="373" y="83" width="58" height="16" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><text x="402" y="94.5" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#000">Buscar</text><text x="520" y="95" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Inicio</text><line x1="500" y1="104" x2="540" y2="104" stroke="#000" stroke-width="3" /><circle cx="564" cy="91" r="9" fill="#fff" stroke="#999" stroke-width="1" /><text x="578" y="95" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Cuenta</text><path d="M620 89 l8 0 l-4 5 z" fill="#000" stroke="#000" stroke-width="1" /><text x="30" y="132" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#000" font-weight="bold">2. Con el menú de cuenta abierto</text><rect x="20" y="138" width="640" height="30" fill="#fff" stroke="#000" stroke-width="1" /><text x="30" y="157" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#000" font-weight="bold">PlanB</text><rect x="245" y="143" width="190" height="20" rx="10" fill="#fff" stroke="#000" stroke-width="1" /><text x="255" y="157" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" fill="#999">Buscar personas</text><rect x="373" y="145" width="58" height="16" rx="8" fill="#fff" stroke="#000" stroke-width="1" /><text x="402" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" fill="#000">Buscar</text><text x="520" y="157" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#000" font-weight="bold">Inicio</text><line x1="500" y1="166" x2="540" y2="166" stroke="#000" stroke-width="3" /><circle cx="564" cy="153" r="9" fill="#fff" stroke="#999" stroke-width="1" /><text x="578" y="157" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#000">Cuenta</text><path d="M620 151 l8 0 l-4 5 z" fill="#000" stroke="#000" stroke-width="1" /><rect x="530" y="170" width="120" height="48" rx="4" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="4 3" /><text x="540" y=